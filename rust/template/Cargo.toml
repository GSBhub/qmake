[package]
name = "qmake-template"
version = "0.1.0"
edition = "2021"
publish = false
description = "Template for an out-of-tree QEMU peripheral written in Rust"

[lib]
# Built as a static library for the (v1-staged) static-into-QEMU path, and as a
# cdylib for the future LD_PRELOAD / --enable-modules load paths.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# A real device reuses QEMU's in-tree Rust crates from the submodule. In QEMU
# 10.2 these are split crates (qom, bql, system, common, util, qemu-macros, ...)
# whose FFI bindings are generated by meson's `rust.bindgen` against the
# configured build. Full Rust-device integration therefore happens through the
# same meson injection used for C (rust.static_library) and is staged for a
# later milestone. Uncomment and adjust paths once that lands:
#
# qom        = { path = "../../extern/qemu/rust/qom" }
# bql        = { path = "../../extern/qemu/rust/bql" }
# system     = { path = "../../extern/qemu/rust/system" }
# common     = { path = "../../extern/qemu/rust/common" }
# util       = { path = "../../extern/qemu/rust/util" }
# hwcore     = { path = "../../extern/qemu/rust/hw/core" }
