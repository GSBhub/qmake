[package]
name = "qmake-rust-devices"
version = "0.1.0"
edition = "2021"
publish = false
resolver = "2"
description = "Example out-of-tree QEMU SysBus peripherals written in Rust (qmake)"

[lib]
# rlib for standalone cargo verification; staticlib for the (meson-injected) link
# into QEMU. QEMU 10.2's Rust API supports SysBusDevice (no PCI yet), so these are
# SysBus analogs of the C examples.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Path-deps into the QEMU submodule's Rust crates. An out-of-tree consumer would
# have these generated by qmake from QMAKE_QEMU_DIR; here the example lives in the
# repo so the relative paths are fixed.
common = { path = "../../extern/qemu/rust/common" }
util   = { path = "../../extern/qemu/rust/util" }
bql    = { path = "../../extern/qemu/rust/bql" }
qom    = { path = "../../extern/qemu/rust/qom" }
system = { path = "../../extern/qemu/rust/system" }
hwcore = { path = "../../extern/qemu/rust/hw/core" }
